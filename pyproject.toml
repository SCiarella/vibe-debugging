[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "bead-diffusion"
version = "0.1.0"
description = "Estimate the diffusion coefficient of a bead in water, from its trajectory"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "pandas",
]

[project.optional-dependencies]
# pip install -e ".[test]"
test = ["pytest"]

[tool.setuptools]
py-modules = ["analysis"]
